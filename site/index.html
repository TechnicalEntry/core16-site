<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core16 — NCAA eligibility tracking for Canadian hockey players</title>
<meta name="description" content="Core16 tracks NCAA Division I/II academic eligibility for Canadian high school hockey players. Launching in Ontario and BC.">
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1a2b;
    --ink-light: #bfd6f2;
    --amber: #f0a600;
    --good: #1f8a5c;
    --paper: #f7f7f5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* faint rink center-line motif */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(240, 166, 0, 0.07) 0%, transparent 45%),
      repeating-linear-gradient(90deg, rgba(191, 214, 242, 0.035) 0, rgba(191, 214, 242, 0.035) 1px, transparent 1px, transparent 64px);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 24px 6vh;
  }

  .mark {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    margin-bottom: 28px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }

  .badge {
    font-family: "Oswald", -apple-system, sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    background: rgba(240, 166, 0, 0.14);
    border: 1px solid rgba(240, 166, 0, 0.35);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: "Oswald", -apple-system, sans-serif;
    font-weight: 700;
    font-stretch: condensed;
    letter-spacing: 0.02em;
    font-size: clamp(56px, 13vw, 112px);
    line-height: 0.95;
    margin: 0 0 18px;
    color: var(--paper);
  }

  h1 span {
    color: var(--amber);
  }

  .tagline {
    max-width: 560px;
    font-size: clamp(17px, 2.4vw, 20px);
    line-height: 1.5;
    color: var(--ink-light);
    margin: 0 0 36px;
  }

  .provinces {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 44px;
  }

  .province {
    font-family: "Oswald", -apple-system, sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper);
    background: rgba(191, 214, 242, 0.08);
    border: 1px solid rgba(191, 214, 242, 0.18);
    border-radius: 10px;
    padding: 10px 18px;
  }

  .province strong {
    color: var(--good);
    font-weight: 500;
  }

  .status {
    font-size: 14px;
    color: rgba(191, 214, 242, 0.55);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px 24px 28px;
    font-size: 12px;
    color: rgba(191, 214, 242, 0.4);
  }

  footer a {
    color: rgba(191, 214, 242, 0.6);
    text-decoration: none;
  }

  footer a:hover {
    color: var(--amber);
  }
</style>
</head>
<body>
  <main>
    <img class="mark" src="assets/mark.svg" alt="Core16 logo" width="96" height="96">
    <div class="badge">Coming soon</div>
    <h1>CORE<span>16</span></h1>
    <p class="tagline">
      NCAA Division I/II academic eligibility, tracked for Canadian high
      school hockey players — courses, marks, and core GPA in one place.
    </p>
    <div class="provinces">
      <div class="province">Ontario — <strong>launching</strong></div>
      <div class="province">British Columbia — <strong>launching</strong></div>
    </div>
    <p class="status">Core16 is in development. This page will update as we get closer to launch.</p>
  </main>
  <footer>
    &copy; 2026 Core16
  </footer>
</body>
</html>
