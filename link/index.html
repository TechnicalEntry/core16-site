<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Core16 link code</title>
<link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1a2b;
    --ink-light: #bfd6f2;
    --amber: #f0a600;
    --paper: #f7f7f5;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(240, 166, 0, 0.07) 0%, transparent 45%),
      repeating-linear-gradient(90deg, rgba(191, 214, 242, 0.035) 0, rgba(191, 214, 242, 0.035) 1px, transparent 1px, transparent 64px);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 24px 6vh;
  }

  .mark {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }

  .badge {
    font-family: "Oswald", -apple-system, sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    background: rgba(240, 166, 0, 0.14);
    border: 1px solid rgba(240, 166, 0, 0.35);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 24px;
  }

  .code {
    font-family: "Oswald", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    font-size: clamp(48px, 14vw, 88px);
    letter-spacing: 0.08em;
    line-height: 1;
    margin: 0 0 24px;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
  }

  .code .dash { color: var(--amber); }

  .steps {
    max-width: 440px;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink-light);
    margin: 0;
  }

  .steps strong { color: var(--paper); font-weight: 600; }

  .note {
    max-width: 440px;
    margin: 20px 0 0;
    font-size: 14px;
    color: rgba(191, 214, 242, 0.55);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px 24px 28px;
    font-size: 12px;
    color: rgba(191, 214, 242, 0.4);
  }
</style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/mark.svg" alt="Core16 logo" width="72" height="72">
    <div class="badge" id="badge">Your link code</div>
    <p class="code" id="code" aria-live="polite"></p>
    <p class="steps" id="steps"></p>
    <p class="note">Codes are single use and expire after 7 days. If this one doesn't work, ask your Core16 advisor for a new one.</p>
  </main>
  <footer>&copy; 2026 Core16</footer>

<script>
  // Mirrors the app's own rules (LinkCodeField.sanitize): letters and numbers
  // only, uppercased, exactly six. Written with textContent throughout, so
  // whatever arrives in ?code= is shown as text and never parsed as markup.
  (function () {
    var raw = new URLSearchParams(window.location.search).get("code") || "";
    var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    var codeEl = document.getElementById("code");
    var stepsEl = document.getElementById("steps");

    if (code.length !== 6) {
      document.getElementById("badge").textContent = "Link code missing";
      stepsEl.textContent = "This link doesn't contain a complete code. Check the message from your Core16 advisor, or ask them to send it again.";
      return;
    }

    codeEl.appendChild(document.createTextNode(code.slice(0, 3)));
    var dash = document.createElement("span");
    dash.className = "dash";
    dash.textContent = "–";
    codeEl.appendChild(dash);
    codeEl.appendChild(document.createTextNode(code.slice(3)));

    stepsEl.appendChild(document.createTextNode("If the Core16 app is on this phone, tapping the link opens it with this code filled in. Otherwise, open the app, go to the "));
    var tab = document.createElement("strong");
    tab.textContent = "Advisor";
    stepsEl.appendChild(tab);
    stepsEl.appendChild(document.createTextNode(" tab, and enter it under “Link to your Core16 advisor”."));
  })();
</script>
</body>
</html>
